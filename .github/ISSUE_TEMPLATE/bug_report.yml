name: Bug report
description: Report a reproducible framework problem
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Description, description: What happened? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: OS, Node, browser, and target environment }
  - type: textarea
    id: logs
    attributes:
      {
        label: Logs and artifacts,
        description: Redact credentials,
        tokens,
        and storage state before attaching anything.,
      }
